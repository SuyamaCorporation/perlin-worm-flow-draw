<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perlin Noise Worm Flow Field Draw</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 min-h-screen flex flex-col items-center p-4">
<h1 class="text-2xl font-bold text-white mb-1">🌊 Perlin Noise Flow Field</h1>
<p class="text-gray-400 text-sm mb-3">Worm particles following a 2D Perlin noise vector field</p>

<div class="flex flex-col lg:flex-row gap-4 w-full max-w-5xl items-start">
  <div class="flex-1 flex justify-center">
    <canvas id="canvas" width="600" height="600" class="rounded-xl border border-gray-700" aria-label="Perlin noise flow field canvas"></canvas>
  </div>
  <div class="lg:w-64 space-y-3">
    <div class="bg-gray-800 rounded-xl p-4 space-y-3">
      <div>
        <label class="text-gray-300 text-sm">Particles: <span id="particleCountVal" class="text-cyan-400 font-bold">200</span></label>
        <input type="range" id="particleCount" min="50" max="500" step="10" value="200" class="w-full" aria-label="Particle count">
      </div>
      <div>
        <label class="text-gray-300 text-sm">Speed: <span id="speedVal" class="text-cyan-400 font-bold">2.0</span></label>
        <input type="range" id="speed" min="0.5" max="5.0" step="0.1" value="2.0" class="w-full" aria-label="Particle speed">
      </div>
      <div>
        <label class="text-gray-300 text-sm">Noise Scale: <span id="noiseScaleVal" class="text-cyan-400 font-bold">0.003</span></label>
        <input type="range" id="noiseScale" min="1" max="20" step="1" value="3" class="w-full" aria-label="Noise scale">
      </div>
      <div>
        <label class="text-gray-300 text-sm">Fade: <span id="fadeVal" class="text-cyan-400 font-bold">0.015</span></label>
        <input type="range" id="fade" min="1" max="30" step="1" value="15" class="w-full" aria-label="Trail fade rate">
      </div>
      <div>
        <label class="text-gray-300 text-sm">Color Theme:</label>
        <select id="colorTheme" class="w-full mt-1 bg-gray-700 text-white rounded px-2 py-1 border border-gray-600" aria-label="Color theme">
          <option value="rainbow">Rainbow</option>
          <option value="ocean">Ocean</option>
          <option value="fire">Fire</option>
          <option value="mono">Mono</option>
        </select>
      </div>
    </div>
    <div class="flex gap-2">
      <button onclick="restart()" class="flex-1 bg-cyan-600 text-white py-2 rounded-lg font-bold hover:bg-cyan-700">Restart</button>
      <button onclick="clearCanvas()" class="flex-1 bg-gray-600 text-white py-2 rounded-lg font-bold hover:bg-gray-700">Clear</button>
    </div>
    <div>
      <label class="text-gray-300 text-sm">Noise Time Drift:</label>
      <input type="range" id="timeDrift" min="0" max="10" step="1" value="0" class="w-full" aria-label="Noise time drift">
      <p class="text-gray-500 text-xs mt-1">Animates the noise field over time</p>
    </div>
    <div id="fps" class="text-gray-500 text-xs text-center"></div>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// Perlin noise implementation
const permTable = new Uint8Array(512);
{
  const p = Array.from({length:256},(_,i)=>i).sort(()=>Math.random()-0.5);
  for(let i=0;i<512;i++) permTable[i]=p[i&255];
}

function fade(t){return t*t*t*(t*(t*6-15)+10);}
function lerp(a,b,t){return a+t*(b-a);}
function grad(hash,x,y){const h=hash&3;const u=h<2?x:y;const v=h<2?y:x;return((h&1)?-u:u)+((h&2)?-v:v);}

function perlin2(x,y){
  const X=Math.floor(x)&255,Y=Math.floor(y)&255;
  x-=Math.floor(x); y-=Math.floor(y);
  const u=fade(x),v=fade(y);
  const a=permTable[X]+Y,b=permTable[X+1]+Y;
  return lerp(lerp(grad(permTable[a],x,y),grad(permTable[b],x-1,y),u),
              lerp(grad(permTable[a+1],x,y-1),grad(permTable[b+1],x-1,y-1),u),v);
}

const THEMES = {
  rainbow: (t)=>`hsl(${(t*360)%360},90%,60%)`,
  ocean: (t)=>`hsl(${200+t*60},80%,${40+t*30}%)`,
  fire: (t)=>`hsl(${t*60},95%,${40+t*30}%)`,
  mono: (t)=>`rgba(${Math.floor(180+t*75)},${Math.floor(180+t*75)},${Math.floor(180+t*75)},1)`,
};

let particles = [];
let running = true;
let noiseTime = 0;
let frameTime = performance.now();
let fpsCount = 0;

function mkParticle() {
  return {
    x: Math.random()*W, y: Math.random()*H,
    vx: 0, vy: 0,
    age: Math.random()*100,
    maxAge: 100 + Math.random()*200,
    colorT: Math.random()
  };
}

function restart() {
  clearCanvas();
  const n = parseInt(document.getElementById('particleCount').value);
  particles = Array.from({length:n}, mkParticle);
}

function clearCanvas() {
  ctx.fillStyle='#000';
  ctx.fillRect(0,0,W,H);
}

function getColor(p) {
  const theme = document.getElementById('colorTheme').value;
  return THEMES[theme](p.colorT);
}

let prevTime = performance.now();
function loop() {
  if(!running) return;

  const now = performance.now();
  const dt = Math.min((now-prevTime)/16, 3);
  prevTime=now;
  fpsCount++;
  if(fpsCount%30===0) document.getElementById('fps').textContent=`~${Math.round(1000/(now-frameTime)*30)} fps`;
  frameTime=now;

  const fadeAmt = parseInt(document.getElementById('fade').value) / 1000;
  const speed = parseFloat(document.getElementById('speed').value);
  const noiseScaleRaw = parseInt(document.getElementById('noiseScale').value);
  const noiseScale = noiseScaleRaw * 0.001;
  const drift = parseInt(document.getElementById('timeDrift').value) * 0.0001;

  // Fade overlay
  ctx.fillStyle=`rgba(0,0,0,${fadeAmt})`;
  ctx.fillRect(0,0,W,H);

  noiseTime += drift * dt;

  for(let i=0;i<particles.length;i++){
    const p = particles[i];
    p.age += dt;
    if(p.age > p.maxAge) {
      particles[i] = mkParticle();
      continue;
    }

    const angle = perlin2(p.x*noiseScale + noiseTime, p.y*noiseScale + noiseTime) * Math.PI * 4;
    const px = p.x, py = p.y;
    p.x += Math.cos(angle) * speed * dt;
    p.y += Math.sin(angle) * speed * dt;

    if(p.x<0||p.x>W||p.y<0||p.y>H){ particles[i]=mkParticle(); continue; }

    const alpha = Math.min(1, p.age/20) * (1 - p.age/p.maxAge);
    ctx.beginPath();
    ctx.moveTo(px,py);
    ctx.lineTo(p.x,p.y);
    ctx.strokeStyle = getColor(p);
    ctx.globalAlpha = alpha * 0.7;
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  requestAnimationFrame(loop);
}

document.getElementById('particleCount').addEventListener('input',e=>{
  document.getElementById('particleCountVal').textContent=e.target.value;
  const n=parseInt(e.target.value);
  while(particles.length<n) particles.push(mkParticle());
  while(particles.length>n) particles.pop();
});
document.getElementById('speed').addEventListener('input',e=>document.getElementById('speedVal').textContent=e.target.value);
document.getElementById('noiseScale').addEventListener('input',e=>document.getElementById('noiseScaleVal').textContent=(e.target.value*0.001).toFixed(3));
document.getElementById('fade').addEventListener('input',e=>document.getElementById('fadeVal').textContent=(e.target.value/1000).toFixed(3));

clearCanvas();
restart();
loop();
</script>
</body>
</html>
